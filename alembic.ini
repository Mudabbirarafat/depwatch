# Alembic config for local use: `alembic upgrade head`, `alembic revision
# --autogenerate -m "..."`. The database URL is deliberately NOT set here -
# env.py reads DATABASE_URL from the environment, so the same migrations run
# against SQLite locally and Postgres on the platform without editing a file.
[alembic]
script_location = src/depwatch/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
