# Render blueprint.
#
# With this file on the default branch, "New > Blueprint" stands the whole
# thing up from the repository - no console clicking to reproduce, and the
# deployment configuration is reviewable in the same diff as the code.

services:
  - type: web
    name: depwatch
    # Docker rather than the native Python runtime, because the dashboard is
    # a React build and the native runtime has no Node. The Dockerfile builds
    # the frontend in a first stage and copies the output into the service
    # image, so there is no committed build output in this repository and no
    # second deployment to keep alive.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

    # /healthz answers from the database, so this checks the engine and the
    # schema, not just that a process is listening. The app creates its tables
    # before the port opens for exactly this reason.
    healthCheckPath: /healthz

    envVars:
      # SQLite on the instance's own disk, deliberately.
      #
      # The free tier gives an ephemeral filesystem and spins the instance down
      # when idle, so this database does not survive a restart. That is a fair
      # trade here: the warehouse is derived data that rebuilds from npm and
      # OSV in about a minute, and the alternative - Render's free Postgres -
      # expires after a month and leaves a dead link behind, which is the
      # failure mode worth avoiding on something recruiters click.
      #
      # For a persistent instance: add a `databases:` block, point DATABASE_URL
      # at its connection string via fromDatabase, and change buildCommand to
      # `pip install ".[postgres]"`. Nothing in the application changes.
      - key: DATABASE_URL
        value: sqlite:////tmp/depwatch/depwatch.db

      # The raw zone lands here. Ephemeral too, which is the honest shape of a
      # free instance: replay-from-disk works within the life of one instance.
      - key: RAW_DIR
        value: /tmp/depwatch/raw

      # Fill an empty instance in the background on boot, so a cold start shows
      # real data instead of an empty table.
      - key: SEED_ON_START
        value: "1"
      - key: INIT_DB_ON_START
        value: "1"

      # The shared secret for POST /refresh. Render generates the value and it
      # never appears in this repository. Copy it from the dashboard into the
      # DEPWATCH_REFRESH_TOKEN repository secret so the scheduled workflow can
      # authenticate. Until it is set, /refresh answers 503 - the endpoint is
      # disabled rather than unprotected.
      - key: REFRESH_TOKEN
        generateValue: true

      # Optional. GitHub enrichment - archived repositories, last commit,
      # contributor counts - is skipped entirely without one, because
      # unauthenticated GitHub allows 60 requests an hour and each package
      # costs two. Set it in the dashboard to turn enrichment on; a read-only
      # token with no scopes is enough for public repositories.
      - key: GITHUB_TOKEN
        sync: false

      # The freshness gate allows a daily schedule one missed run.
      - key: MAX_DATA_AGE_HOURS
        value: "50"
