name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  # The suite mocks the registry, so this job is the one that notices when
  # npm changes a payload shape under us. It is allowed to fail the build:
  # a silent schema drift is exactly what this project is meant to catch.
  live-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Ingest and analyse real packages
        env:
          DATABASE_URL: sqlite:///smoke.db
        run: |
          python -m depwatch.cli migrate
          python -m depwatch.cli ingest express react lodash
          python -m depwatch.cli advisories express react lodash
          python -m depwatch.cli runs
          # Prove the whole chain, not just ingestion: the API must answer
          # from what the run just wrote.
          python - <<'EOF'
          import json
          from fastapi.testclient import TestClient
          from depwatch.api import app
          c = TestClient(app)
          health = c.get("/healthz").json()
          assert health["packages"] == 3, health
          assert health["advisories"] > 0, health
          body = c.post("/analyse", json={"names": ["express", "react", "lodash"]}).json()
          assert body["summary"]["analysed"] == 3, body
          assert not body["unknown"], body

          # Range resolution must change the verdict, not just the report: an
          # old lodash pin carries advisories that the current release fixed.
          pinned = c.post(
              "/analyse",
              json={"manifest": {"dependencies": {"lodash": "4.17.11"}}},
          ).json()["analysed"][0]
          latest = [p for p in body["analysed"] if p["name"] == "lodash"][0]
          assert pinned["resolution"] == "resolved", pinned
          assert pinned["scored_version"] == "4.17.11", pinned
          assert pinned["score"] > latest["score"], (pinned, latest)
          print(json.dumps(body["summary"]))
          print("pinned lodash:", pinned["score"], "vs latest:", latest["score"])
          EOF

  # Everything above runs on SQLite, including the whole unit suite, so the
  # Postgres branches are otherwise never executed. The upsert in particular
  # picks its insert construct by dialect: `upsert_packages` uses pg_insert
  # here and sqlite_insert everywhere else, and that is the piece reruns and
  # backfills depend on being correct.
  postgres:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: depwatch
          POSTGRES_PASSWORD: depwatch
          POSTGRES_DB: depwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://depwatch:depwatch@localhost:5432/depwatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,postgres]"

      - name: Migrations apply to Postgres
        run: python -m depwatch.cli migrate

      - name: The migrations describe the models on Postgres too
        run: |
          python - <<'EOF'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from sqlalchemy import create_engine
          from depwatch.config import settings
          from depwatch.models import Base

          with create_engine(settings.database_url).connect() as connection:
              difference = compare_metadata(MigrationContext.configure(connection), Base.metadata)
          # SQLite cannot express everything Postgres can, so drift that the
          # local suite cannot see shows up here.
          assert difference == [], difference
          print("no drift on postgres")
          EOF

      - name: Ingest, rerun, and prove the Postgres upsert is idempotent
        run: |
          python -m depwatch.cli ingest express lodash minimist
          python -m depwatch.cli advisories express lodash minimist
          python - <<'EOF'
          from sqlalchemy import func, select
          from depwatch.db import session_scope
          from depwatch.models import Advisory, Package

          with session_scope() as session:
              before = (
                  session.scalar(select(func.count()).select_from(Package)),
                  session.scalar(select(func.count()).select_from(Advisory)),
              )
          print("after first run:", before)
          assert before[0] == 3, before
          assert before[1] > 0, before
          EOF

          # The same three packages again. ON CONFLICT DO UPDATE has to refresh
          # rather than insert, or a rerun after a crash doubles the warehouse.
          python -m depwatch.cli ingest express lodash minimist
          python -m depwatch.cli advisories express lodash minimist
          python - <<'EOF'
          from sqlalchemy import func, select
          from depwatch.db import session_scope
          from depwatch.models import Advisory, Package

          with session_scope() as session:
              packages = session.scalar(select(func.count()).select_from(Package))
              advisories = session.scalar(select(func.count()).select_from(Advisory))
              first_seen, fetched = session.execute(
                  select(Package.first_seen_at, Package.fetched_at).where(Package.name == "express")
              ).one()

          assert packages == 3, f"rerun duplicated packages: {packages}"
          print("after rerun:", packages, advisories)
          # first_seen_at records when we first learned of the package and must
          # survive every later refresh; fetched_at must move.
          assert fetched >= first_seen, (fetched, first_seen)
          print("first_seen preserved:", first_seen, "fetched:", fetched)
          EOF

      - name: The gates read Postgres timestamps correctly
        run: |
          python - <<'EOF'
          # Postgres returns timezone-aware datetimes where SQLite returns
          # naive ones. The freshness gate compares against an aware now(), so
          # this is the half of that comparison the local suite cannot reach.
          from depwatch.gates import evaluate

          report = evaluate()
          for gate in report["gates"]:
              print(f"{'PASS' if gate['passed'] else 'FAIL'}  {gate['name']:26} {gate['detail']}")
          assert report["passed"], report
          EOF

      - name: The API answers from Postgres
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from depwatch.api import app

          client = TestClient(app)
          assert client.get("/healthz").json()["packages"] == 3
          body = client.post("/analyse", json={"names": ["express", "lodash", "minimist"]}).json()
          assert body["summary"]["analysed"] == 3, body
          assert client.get("/gates").status_code == 200
          print("postgres end to end:", body["summary"])
          EOF

  # The dashboard is a real application now, so it is typechecked, linted,
  # tested and built like one. The build runs `tsc --noEmit` first, so a type
  # error fails here rather than producing a bundle nobody typechecked.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # The image is the deployment: Render builds this exact Dockerfile. A green
  # `test` job proves the Python works and a green `frontend` job proves the
  # React works; only this proves the thing that actually ships.
  image:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build the image the platform will build
        run: docker build -t depwatch:ci .

      - name: It serves the built dashboard and answers the API
        run: |
          docker run -d --name depwatch -p 8000:8000 \
            -e SEED_ON_START=0 \
            -e DATABASE_URL=sqlite:////tmp/depwatch/ci.db \
            depwatch:ci

          python - <<'EOF'
          import json, sys, time, urllib.error, urllib.request

          def get(path):
              return urllib.request.urlopen(f"http://localhost:8000{path}", timeout=10)

          for attempt in range(40):
              try:
                  health = json.load(get("/healthz"))
                  break
              except Exception:
                  time.sleep(1.5)
          else:
              sys.exit("the container never answered /healthz")

          print("healthz:", health)
          assert health["status"] == "ok", health

          # The page must be the built React app. A missing build answers 503
          # with an explanation, which is useful locally and a failure here.
          page = get("/").read().decode()
          assert "/assets/" in page, "the dashboard was not built into the image"
          print("dashboard served, references its asset bundle")

          # And the hashed bundle itself has to be reachable, not just named.
          import re
          asset = re.search(r'/assets/[A-Za-z0-9_.-]+\.js', page)
          assert asset, page[:400]
          assert get(asset.group(0)).status == 200
          print("asset bundle served:", asset.group(0))
          EOF

      - name: Container logs
        if: always()
        run: docker logs depwatch
