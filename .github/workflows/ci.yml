name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  # The suite mocks the registry, so this job is the one that notices when
  # npm changes a payload shape under us. It is allowed to fail the build:
  # a silent schema drift is exactly what this project is meant to catch.
  live-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Ingest a few real packages
        env:
          DATABASE_URL: sqlite:///smoke.db
        run: |
          python -m depwatch.cli init-db
          python -m depwatch.cli ingest express react @types/node
          python -m depwatch.cli runs
