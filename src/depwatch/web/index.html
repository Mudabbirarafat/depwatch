<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depwatch</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6a6a6a; --line: #e4e4e7;
    --card: #fafafa; --high: #b42318; --medium: #b54708; --low: #067647;
    --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d;
      --card: #161b22; --high: #ff7b72; --medium: #e3b341; --low: #3fb950;
      --accent: #58a6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 .2rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 1.6rem; }
  .status { font-size: .85rem; color: var(--muted); margin-bottom: 1.2rem; }
  textarea {
    width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical;
  }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    padding: 9px 16px; font-size: .92rem; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 26px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .band-high { color: var(--high); } .band-medium { color: var(--medium); } .band-low { color: var(--low); }
  .reasons { color: var(--muted); font-size: .85rem; margin: 4px 0 0; padding-left: 16px; }
  code { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); }
  .summary { margin-top: 20px; font-size: .9rem; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 26px; }
  footer { margin-top: 48px; font-size: .82rem; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>depwatch</h1>
  <p class="sub">Which of your dependencies are unmaintained, single-maintainer, or carrying advisories your pinned version has not fixed.</p>
  <p class="status" id="status">checking…</p>

  <textarea id="input" spellcheck="false" aria-label="package.json or dependency names"></textarea>
  <div class="row">
    <button id="run">Analyse</button>
    <button id="sample" class="secondary">Load a risky example</button>
    <button id="browse" class="secondary">Show everything ingested</button>
  </div>

  <div id="out"></div>

  <footer>
    Scores are explained, never bare. Advisories count only when your resolved
    version is below the published fix.
    <a href="/docs">API docs</a> · <a href="https://github.com/Mudabbirarafat/depwatch">source</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

const SAMPLE = {
  dependencies: {
    "lodash": "4.17.11",
    "minimist": "1.2.0",
    "express": "4.17.1",
    "request": "^2.88.0",
    "left-pad": "^1.3.0"
  }
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

async function refreshStatus() {
  try {
    const r = await fetch("/healthz");
    const h = await r.json();
    if (h.packages === 0) {
      $("status").textContent = "first boot — ingesting seed packages, this takes about a minute…";
      setTimeout(refreshStatus, 5000);
    } else {
      const when = h.last_run?.finished_at ? new Date(h.last_run.finished_at).toUTCString() : "unknown";
      $("status").textContent =
        `${h.packages} packages · ${h.advisories} advisories · last run ${h.last_run?.source ?? "?"} (${h.last_run?.status ?? "?"}) ${when}`;
    }
  } catch {
    $("status").textContent = "could not reach the API";
  }
}

function render(body) {
  if (!body.analysed.length) {
    $("out").innerHTML = `<p class="empty">Nothing matched. ${
      body.unknown.length ? "Not yet ingested: <code>" + esc(body.unknown.join(", ")) + "</code>" : ""
    }</p>`;
    return;
  }
  const rows = body.analysed.map((p) => `
    <tr>
      <td>
        <strong>${esc(p.name)}</strong>
        <ul class="reasons">${p.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
      </td>
      <td><code>${esc(p.requested_range ?? "—")}</code><br><code>→ ${esc(p.scored_version ?? "?")}</code></td>
      <td>${p.advisories}</td>
      <td class="score band-${esc(p.band)}">${p.score}<br><small>${esc(p.band)}</small></td>
    </tr>`).join("");

  $("out").innerHTML = `
    <table>
      <thead><tr><th>Package</th><th>Range / scored</th><th>Advisories</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="summary">
      ${body.summary.analysed} analysed ·
      ${body.summary.high} high · ${body.summary.medium} medium · ${body.summary.low} low
      ${body.summary.unresolved_ranges ? " · " + body.summary.unresolved_ranges + " range(s) not resolvable" : ""}
      ${body.summary.truncated ? " · showing the worst " + body.summary.analysed + " of " + body.summary.truncated : ""}
      ${body.unknown.length ? " · not ingested: <code>" + esc(body.unknown.join(", ")) + "</code>" : ""}
    </p>`;
}

async function analyse() {
  const text = $("input").value.trim();
  if (!text) return;
  $("run").disabled = true;
  $("out").innerHTML = `<p class="empty">analysing…</p>`;
  let payload;
  try {
    const parsed = JSON.parse(text);
    payload = parsed.dependencies || parsed.devDependencies || parsed.peerDependencies
      ? { manifest: parsed }
      : { names: Object.keys(parsed) };
  } catch {
    // Not JSON: treat it as a list of names, one per line or comma separated.
    payload = { names: text.split(/[\s,]+/).filter(Boolean) };
  }
  try {
    const r = await fetch("/analyse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    render(await r.json());
  } catch {
    $("out").innerHTML = `<p class="empty">request failed</p>`;
  } finally {
    $("run").disabled = false;
  }
}

$("run").addEventListener("click", analyse);
$("sample").addEventListener("click", () => {
  $("input").value = JSON.stringify(SAMPLE, null, 2);
  analyse();
});
$("browse").addEventListener("click", async () => {
  $("out").innerHTML = `<p class="empty">loading…</p>`;
  // The endpoint sorts the whole ecosystem and then pages, so this is the
  // worst 200 rather than an arbitrary 200. `total` says what was behind it.
  const r = await fetch("/packages?limit=200");
  const body = await r.json();
  render({
    analysed: body.packages.map((p) => ({ ...p, requested_range: null, scored_version: p.latest_version })),
    unknown: [],
    summary: {
      analysed: body.count,
      truncated: body.total > body.count ? body.total : 0,
      high: body.packages.filter((p) => p.band === "high").length,
      medium: body.packages.filter((p) => p.band === "medium").length,
      low: body.packages.filter((p) => p.band === "low").length,
      unresolved_ranges: 0,
    },
  });
});

refreshStatus();
</script>
</body>
</html>
